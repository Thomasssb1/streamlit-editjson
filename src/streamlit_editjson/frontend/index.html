<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>streamlit-editjson</title>
  <script src="./streamlit-component-lib.js"></script>
  <script src="./main.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="root">
    <div class="json-toolbar">
      <span class="json-toolbar-title">JSON</span>
      <button id="copy-json" type="button" aria-live="polite" aria-atomic="true" title="Copy the current valid JSON">Copy JSON</button>
    </div>
    <div id="copy-status" class="json-copy-status" role="status" aria-live="polite"></div>
    <textarea id="copy-fallback" aria-label="JSON to copy" readonly hidden spellcheck="false"></textarea>
    <div id="json-container"></div>
  </div>
</body>

</html>
